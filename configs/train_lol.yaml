# RetinexMamba — Training Configuration
# Edit paths to match your dataset location

# ── Dataset ───────────────────────────────────────────────────────────────────
data:
  train_low:  ./data/lol/our485/low
  train_high: ./data/lol/our485/high
  test_low:   ./data/lol/eval15/low
  test_high:  ./data/lol/eval15/high
  patch_size: 128

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  in_channels:     3
  dim:             48
  num_blocks:      [2, 2, 2]
  num_refinement:  2

# ── Training ──────────────────────────────────────────────────────────────────
train:
  epochs:       200
  batch_size:   8
  num_workers:  2
  lr:           2.0e-4
  betas:        [0.9, 0.999]
  clip_grad:    0.5
  scheduler:
    type:    CosineAnnealingLR
    T_max:   200
    eta_min: 1.0e-6

# ── Loss weights ──────────────────────────────────────────────────────────────
loss:
  w_l1:    1.0
  w_ssim:  0.3
  w_fft:   0.05
  w_illum: 0.01

# ── Logging / Checkpoints ─────────────────────────────────────────────────────
output:
  save_dir:   ./checkpoints
  log_every:  10     # print metrics every N epochs
  save_every: 50     # save periodic checkpoint every N epochs
